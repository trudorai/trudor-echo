<!DOCTYPE html>
<html>
<head>
    <title>HTTPS Test</title>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .secure { color: green; }
        .insecure { color: red; }
        .warning { color: orange; }
    </style>
</head>
<body>
    <h1>🔒 HTTPS Security Test</h1>
    
    <div id="results">
        <h3>Testing...</h3>
    </div>
    
    <h3>Test Resources:</h3>
    <div>
        <img src="http://trudor.ai/favicon.ico" alt="HTTP Image" id="http-img" style="width: 32px; height: 32px;">
        <span id="http-img-status">Loading HTTP image...</span>
    </div>
    
    <div style="margin-top: 10px;">
        <img src="https://trudor.ai/favicon.ico" alt="HTTPS Image" id="https-img" style="width: 32px; height: 32px;">
        <span id="https-img-status">Loading HTTPS image...</span>
    </div>
    
    <script>
        const results = document.getElementById('results');
        
        // Check if page is loaded over HTTPS
        const isHTTPS = window.location.protocol === 'https:';
        
        // Check for HSTS header
        async function checkHSTS() {
            try {
                const response = await fetch(window.location.origin, { method: 'HEAD' });
                const hstsHeader = response.headers.get('strict-transport-security');
                return hstsHeader;
            } catch (error) {
                return null;
            }
        }
        
        // Run tests
        async function runTests() {
            let html = '';
            
            // Test 1: Current protocol
            html += `<p><strong>Current Protocol:</strong> <span class="${isHTTPS ? 'secure' : 'insecure'}">${window.location.protocol}</span></p>`;
            
            // Test 2: HSTS
            const hstsHeader = await checkHSTS();
            html += `<p><strong>HSTS Header:</strong> `;
            if (hstsHeader) {
                html += `<span class="secure">✅ Present: ${hstsHeader}</span>`;
            } else {
                html += `<span class="insecure">❌ Missing</span>`;
            }
            html += `</p>`;
            
            // Test 3: Mixed content
            html += `<p><strong>Mixed Content:</strong> <span id="mixed-content">Checking...</span></p>`;
            
            // Test 4: Redirect test
            html += `<p><strong>HTTP → HTTPS Redirect:</strong> <span id="redirect-test">Testing...</span></p>`;
            
            results.innerHTML = html;
            
            // Test redirect
            testRedirect();
        }
        
        function testRedirect() {
            // Try to fetch HTTP version
            fetch('http://trudor.ai', { 
                method: 'HEAD',
                redirect: 'manual',
                mode: 'no-cors'
            })
            .then(response => {
                const redirectStatus = document.getElementById('redirect-test');
                if (response.status === 301 || response.status === 302 || response.status === 307 || response.status === 308) {
                    redirectStatus.innerHTML = `<span class="secure">✅ Working (${response.status} redirect)</span>`;
                } else if (response.status === 200) {
                    redirectStatus.innerHTML = `<span class="insecure">❌ No redirect (serving HTTP content)</span>`;
                } else {
                    redirectStatus.innerHTML = `<span class="warning">⚠️ Status: ${response.status}</span>`;
                }
            })
            .catch(error => {
                document.getElementById('redirect-test').innerHTML = `<span class="warning">⚠️ Error: ${error.message}</span>`;
            });
        }
        
        // Image load handlers
        document.getElementById('http-img').onload = function() {
            document.getElementById('http-img-status').innerHTML = '<span class="warning">⚠️ HTTP image loaded (mixed content)</span>';
        };
        
        document.getElementById('http-img').onerror = function() {
            document.getElementById('http-img-status').innerHTML = '<span class="secure">✅ HTTP image blocked (good!)</span>';
        };
        
        document.getElementById('https-img').onload = function() {
            document.getElementById('https-img-status').innerHTML = '<span class="secure">✅ HTTPS image loaded</span>';
        };
        
        document.getElementById('https-img').onerror = function() {
            document.getElementById('https-img-status').innerHTML = '<span class="insecure">❌ HTTPS image failed</span>';
        };
        
        // Run tests
        runTests();
        
        // Check for mixed content
        document.addEventListener('securitypolicyviolation', function(e) {
            const mixedContent = document.getElementById('mixed-content');
            if (e.violatedDirective === 'img-src' || e.blockedURI.startsWith('http://')) {
                mixedContent.innerHTML = `<span class="secure">✅ Blocked: ${e.blockedURI}</span>`;
            }
        });
        
        // Fallback mixed content check
        setTimeout(() => {
            const mixedContent = document.getElementById('mixed-content');
            if (mixedContent.innerHTML.includes('Checking...')) {
                mixedContent.innerHTML = '<span class="warning">⚠️ No CSP violations detected (may need manual check)</span>';
            }
        }, 2000);
    </script>
</body>
</html>
