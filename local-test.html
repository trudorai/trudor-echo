<!DOCTYPE html>
<html>
<head>
    <title>Local Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; height: 100px; }
        button { padding: 10px 20px; margin: 10px 0; }
        #output { margin-top: 20px; padding: 10px; background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>Test Trudor Echo Frontend Logic</h1>
    
    <textarea id="contentInput">Test content for debugging the frontend</textarea>
    
    <div>
        <label><input type="checkbox" id="linkedin" checked> LinkedIn</label>
        <label><input type="checkbox" id="twitter" checked> Twitter</label>
        <label><input type="checkbox" id="instagram"> Instagram</label>
    </div>
    
    <button id="testButton">Test Button Click</button>
    
    <div id="output"></div>
    
    <script>
        // Simplified version of the initAIButton logic
        document.getElementById('testButton').addEventListener('click', async function() {
            console.log('Button clicked!');
            
            // Get content
            const contentInput = document.getElementById('contentInput');
            const content = contentInput ? contentInput.value.trim() : '';
            console.log('Content:', content);
            
            // Get selected platforms
            const selectedPlatforms = [];
            document.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => {
                selectedPlatforms.push(cb.id);
            });
            console.log('Selected platforms:', selectedPlatforms);
            
            if (selectedPlatforms.length === 0) {
                alert('Please select at least one platform.');
                return;
            }
            
            // Test API call
            try {
                const apiUrl = 'https://trudor-echo-api.trudorcap.workers.dev';
                console.log('Calling API:', apiUrl);
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: content,
                        platforms: selectedPlatforms
                    })
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('API response:', data);
                
                document.getElementById('output').innerHTML = `
                    <h3>✅ Success!</h3>
                    <p>Echo ID: ${data.echoId}</p>
                    <p>Share URL: <a href="${data.shareUrl}" target="_blank">${data.shareUrl}</a></p>
                    <p>Platforms generated: ${Object.keys(data.results).join(', ')}</p>
                    <button onclick="testEmail('${data.echoId}')">Test Email Send</button>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('output').innerHTML = `<h3>❌ Error:</h3><p>${error.message}</p>`;
            }
        });
        
        async function testEmail(echoId) {
            const email = prompt('Enter test email:');
            if (!email) return;
            
            try {
                const response = await fetch('https://trudor-echo-api.trudorcap.workers.dev/api/send-echo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ echoId, email })
                });
                
                const data = await response.json();
                alert(`Email test: ${data.success ? '✅ Success' : '❌ Failed'}\n${data.message || data.error}`);
            } catch (error) {
                alert(`Email error: ${error.message}`);
            }
        }
    </script>
</body>
</html>
