One-time payment</p>
                    <button class="cta-button" id="pay12" style="background: var(--primary);">Buy Now - $12</button>
                </div>
                
                <div class="pricing-card">
                    <h3>Pro Monthly</h3>
                    <div class="price">$29</div>
                    <p>Monthly subscription</p>
                    <button class="cta-button" id="pay29">Start Pro - $29/month</button>

    <section id="how-it-works">
        <div class="container">
            <h2>How It Works</h2>
            <p>1. Paste your content<br>2. Select platforms<br>3. Get instant results</p>
        </div>
    </section>

    <section id="examples">
        <div class="container">
            <h2>Examples</h2>
            <p>See how content gets transformed for different platforms.</p>
        </div>
    </section>

    <section id="faq">
        <div class="container">
            <h2>FAQ</h2>
            <p>Common questions about Trudor Echo.</p>
        </div>
    </section>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // ============================================
        // ITERATION 1 - ENHANCED INPUT FUNCTIONALITY
        // ============================================
        console.log('=== ITERATION 1 LOADED - Drag & Drop Input ===');
        
        // Set refresh time
        document.getElementById('refreshTime').textContent = new Date().toLocaleTimeString();
        
        // File upload functionality
        const fileDropZone = document.getElementById('fileDropZone');
        const fileUpload = document.getElementById('fileUpload');
        const uploadedFiles = document.getElementById('uploadedFiles');
        const fileList = document.getElementById('fileList');
        const clearFilesBtn = document.getElementById('clearFiles');
        const dropZoneContent = document.getElementById('dropZoneContent');
        
        let uploadedFileList = [];
        
        // Drag and drop events
        fileDropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileDropZone.classList.add('drag-over');
        });
        
        fileDropZone.addEventListener('dragleave', () => {
            fileDropZone.classList.remove('drag-over');
        });
        
        fileDropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            fileDropZone.classList.remove('drag-over');
            
            const files = e.dataTransfer.files;
            handleFiles(files);
        });
        
        // File input change
        fileUpload.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        // Handle uploaded files
        function handleFiles(files) {
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                // Check file size (10MB max)
                if (file.size > 10 * 1024 * 1024) {
                    alert(`File "${file.name}" is too large. Maximum size is 10MB.`);
                    continue;
                }
                
                // Add to list
                uploadedFileList.push({
                    name: file.name,
                    size: formatFileSize(file.size),
                    type: file.type
                });
            }
            
            updateFileDisplay();
        }
        
        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        // Update file display
        function updateFileDisplay() {
            if (uploadedFileList.length > 0) {
                // Show uploaded files section
                dropZoneContent.style.display = 'none';
                uploadedFiles.style.display = 'block';
                fileDropZone.classList.add('has-files');
                
                // Update file list
                fileList.innerHTML = '';
                uploadedFileList.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    fileItem.innerHTML = `
                        <div>
                            <div class="file-name">${file.name}</div>
                            <div class="file-size">${file.size} • ${file.type || 'Unknown type'}</div>
                        </div>
                        <button class="file-remove" data-index="${index}">
                            <i class="fas fa-times"></i>
                        </button>
                    `;
                    fileList.appendChild(fileItem);
                });
                
                // Add remove event listeners
                document.querySelectorAll('.file-remove').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const index = parseInt(e.target.closest('.file-remove').dataset.index);
                        uploadedFileList.splice(index, 1);
                        updateFileDisplay();
                    });
                });
            } else {
                // Show empty drop zone
                dropZoneContent.style.display = 'block';
                uploadedFiles.style.display = 'none';
                fileDropZone.classList.remove('has-files');
            }
        }
        
        // Clear all files
        clearFilesBtn.addEventListener('click', () => {
            uploadedFileList = [];
            updateFileDisplay();
        });
        
        // Text input functionality
        const contentInput = document.getElementById('contentInput');
        const placeholderOverlay = document.getElementById('placeholderOverlay');
        const charCount = document.getElementById('charCount');
        const clearTextBtn = document.getElementById('clearText');
        const generateButton = document.getElementById('generateButton');
        const processingSpinner = document.getElementById('processingSpinner');
        
        // Fade out placeholder when typing
        contentInput.addEventListener('input', () => {
            const text = contentInput.value;
            charCount.textContent = text.length;
            
            if (text.length > 0) {
                placeholderOverlay.classList.add('fade-out');
            } else {
                placeholderOverlay.classList.remove('fade-out');
            }
        });
        
        // Clear text
        clearTextBtn.addEventListener('click', () => {
            contentInput.value = '';
            charCount.textContent = '0';
            placeholderOverlay.classList.remove('fade-out');
            contentInput.focus();
        });
        
        // Generate content button
        generateButton.addEventListener('click', () => {
            const text = contentInput.value.trim();
            const hasFiles = uploadedFileList.length > 0;
            
            if (!text && !hasFiles) {
                alert('Please add some content! Either paste text or upload files.');
                return;
            }
            
            if (text.length < 50 && !hasFiles) {
                alert('Please add more content (minimum 50 characters) or upload files.');
                return;
            }
            
            // Show processing
            generateButton.disabled = true;
            processingSpinner.style.display = 'inline-block';
            
            // Simulate processing
            setTimeout(() => {
                generateButton.disabled = false;
                processingSpinner.style.display = 'none';
                
                if (hasFiles) {
                    alert(`✅ Processing complete!\n\nProcessed ${uploadedFileList.length} file(s) and ${text.length} characters of text.\n\nThis would generate content for all selected platforms.`);
                } else {
                    alert(`✅ Processing complete!\n\nProcessed ${text.length} characters of text.\n\nThis would generate content for all selected platforms.`);
                }
            }, 2000);
        });
        
        // Platform selection
        const platformOptions = document.querySelectorAll('.platform-option');
        const selectAllPlatformsBtn = document.getElementById('selectAllPlatforms');
        
        platformOptions.forEach(option => {
            option.addEventListener('click', () => {
                option.classList.toggle('selected');
            });
        });
        
        selectAllPlatformsBtn.addEventListener('click', () => {
            platformOptions.forEach(option => {
                option.classList.add('selected');
            });
        });
        
        // Initialize all platforms as selected
        platformOptions.forEach(option => {
            option.classList.add('selected');
        });
        
        // ============================================
        // EXISTING BUTTON FUNCTIONALITY
        // ============================================
        
        // Function to scroll to input
        function scrollToInput() {
            document.getElementById('input').scrollIntoView({ behavior: 'smooth' });
        }
        
        // Payment buttons
        document.getElementById('pay12').onclick = function() {
            alert('$12 PAYMENT BUTTON WORKS!\n\nITERATION 1 - Drag & Drop added\n\nTo set up Stripe:\n1. Go to stripe.com\n2. Create $12 product\n3. Add your API key');
        };
        
        document.getElementById('pay29').onclick = function() {
            alert('$29/month BUTTON WORKS!\n\nITERATION 1 - Drag & Drop added\n\nTo set up Stripe:\n1. Go to stripe.com\n2. Create $29/month product\n3. Add your API key');
        };
        
        // Navigation links
        document.querySelectorAll('a[href^="#"]').forEach(link => {
            link.onclick = function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('href').substring(1);
                const target = document.getElementById(targetId);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                    console.log('Scrolled to #' + targetId);
                }
                return false;
            };
        });
        
        // Hero CTA button
        document.querySelector('.hero .cta-button').onclick = function(e) {
            e.preventDefault();
            scrollToInput();
            return false;
        };
        
        // Header CTA button
        document.querySelector('header .cta-button').onclick = function(e) {
            e.preventDefault();
            document.getElementById('pricing').scrollIntoView({ behavior: 'smooth' });
            return false;
        };
        
        console.log('=== ITERATION 1 SETUP COMPLETE ===');
        console.log('Features added:');
        console.log('1. Drag & drop file upload');
        console.log('2. File preview with animations');
        console.log('3. Fading placeholder text');
        console.log('4. Character counter');
        console.log('5. Visual platform selection');
        
        // Show iteration notice
        setTimeout(() => {
            console.log('🔄 Page refreshed at:', new Date().toLocaleTimeString());
        }, 1000);
    </script>
</body>
</html>
