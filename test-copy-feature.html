<!DOCTYPE html>
<html>
<head>
    <title>Test Copy Feature</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .test-button {
            padding: 10px 20px;
            margin: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .test-button.copied {
            background: #28a745;
        }
        #output {
            margin-top: 20px;
            padding: 10px;
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <h1>Test Copy to Clipboard Feature</h1>
    
    <button class="test-button" onclick="testCopy('https://trudor.ai/results/test-echo-123', this)">
        <i class="fas fa-copy"></i> Copy Test Link
    </button>
    
    <button class="test-button" onclick="testCopy('This is test content for the platform output', this)">
        <i class="fas fa-copy"></i> Copy Test Content
    </button>
    
    <div id="output"></div>
    
    <script>
        // Simplified copy function for testing
        async function testCopy(text, button) {
            const output = document.getElementById('output');
            output.innerHTML = 'Testing...';
            
            try {
                await navigator.clipboard.writeText(text);
                
                // Visual feedback
                const originalHTML = button.innerHTML;
                const originalClass = button.className;
                button.innerHTML = '<i class="fas fa-check"></i> Copied!';
                button.className = 'test-button copied';
                
                output.innerHTML = `<span style="color: green;">✅ Successfully copied to clipboard:</span><br><code>${text}</code>`;
                
                // Reset button after 2 seconds
                setTimeout(() => {
                    button.innerHTML = originalHTML;
                    button.className = originalClass;
                }, 2000);
                
            } catch (err) {
                console.error('Copy failed:', err);
                
                // Try fallback
                try {
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    
                    // Visual feedback
                    const originalHTML = button.innerHTML;
                    const originalClass = button.className;
                    button.innerHTML = '<i class="fas fa-check"></i> Copied!';
                    button.className = 'test-button copied';
                    
                    output.innerHTML = `<span style="color: green;">✅ Successfully copied (fallback method):</span><br><code>${text}</code>`;
                    
                    // Reset button after 2 seconds
                    setTimeout(() => {
                        button.innerHTML = originalHTML;
                        button.className = originalClass;
                    }, 2000);
                    
                } catch (fallbackErr) {
                    output.innerHTML = `<span style="color: red;">❌ Failed to copy:</span><br><code>${text}</code><br>Error: ${fallbackErr.message}`;
                }
            }
        }
        
        // Load Font Awesome for icons
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
        document.head.appendChild(link);
    </script>
</body>
</html>
